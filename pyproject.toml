[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dapi2marker"
version = "0.1.0"
description = "Conditional latent diffusion for DAPI-to-marker translation across colon and liver tissue"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "dapi2marker contributors"}]
dependencies = [
  "torch>=2.4,<3; python_version < '3.13'",
  "torch>=2.6,<3; python_version >= '3.13'",
  "diffusers>=0.30,<1",
  "accelerate>=1.0,<2",
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "scikit-image>=0.22,<1",
  "tqdm>=4.66,<5",
  "safetensors>=0.4,<1",
  "huggingface-hub>=0.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.9,<1"]

[project.scripts]
dapi2marker = "dapi2marker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/dapi2marker/models/unet.py" = ["E741"]

